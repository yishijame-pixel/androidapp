worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # 防 DDoS / 爬虫：每 IP 限速（App 正常下载 zip 通常 1 连接）
    limit_req_zone  $binary_remote_addr zone=assets_req:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=assets_conn:10m;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # 安全响应头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /manifest.json {
            limit_req zone=assets_req burst=20 nodelay;
            default_type application/json;
            add_header Cache-Control "public, max-age=300" always;
        }

        location /bundles/ {
            limit_req zone=assets_req burst=10 nodelay;
            limit_conn assets_conn 4;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            types { }
            default_type application/zip;

            location ~* \.zip$ {
                # 仅 zip
            }
        }

        location / {
            return 404;
        }

        autoindex off;
    }
}
