# Cloudflare Named Tunnel — Docker 版
#
# 使用前：
#   1. cloudflared tunnel login
#   2. cloudflared tunnel create funlife-pb
#   3. 将 <TUNNEL_UUID>.json 复制到本目录
#   4. 复制本文件为 config.yml，替换 <TUNNEL_UUID>
#   5. cloudflared tunnel route dns funlife-pb pb.yishi.site
#
# 启动：docker compose --profile tunnel up -d

tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json

ingress:
  # 游戏静态资源 manifest + zip（独立子域，见 docs/game-assets-static-hosting.md）
  - hostname: assets.yishi.site
    service: http://assets-static:80
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      httpHostHeader: assets.yishi.site
  # 同域热路径：wss://pb.yishi.site/draw-ws/ws
  - hostname: pb.yishi.site
    path: ^/draw-ws
    service: http://draw-ws:8790
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      httpHostHeader: pb.yishi.site
  # Pac-Maze 权威对战：wss://pb.yishi.site/pac-maze-ws/pac-maze-ws
  - hostname: pb.yishi.site
    path: ^/pac-maze-ws
    service: http://pac-maze-ws:8791
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      httpHostHeader: pb.yishi.site
  - hostname: pb.yishi.site
    service: http://pocketbase:8090
  # 旧独立子域（可选保留）
  - hostname: draw.yishi.site
    service: http://draw-ws:8790
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
  - service: http_status:404
