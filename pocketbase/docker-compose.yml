# FunLife 社交服务 — Docker Compose
#
# 核心服务（默认启动）:
#   docker compose up -d
#
# 含 FCM 推送中继:
#   docker compose --profile push up -d
#
# 含 Cloudflare 隧道:
#   docker compose --profile tunnel up -d
#
# 含 VIP 管理后台（CloudBase）:
#   docker compose --profile admin up -d
#
# 完整生产栈:
#   docker compose --profile push --profile tunnel --profile admin up -d

name: funlife

services:
  pocketbase:
    build:
      context: .
      dockerfile: docker/Dockerfile.pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.39.0}
    container_name: funlife-pocketbase
    restart: unless-stopped
    ports:
      - "${PB_HOST_PORT:-8090}:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks:ro
      - ./pb_migrations:/pb/pb_migrations:ro
    environment:
      # 仅在使用 --profile push 时于 .env 中设置 FCM_RELAY_URL=http://fcm-relay:8787/push
      FCM_RELAY_URL: ${FCM_RELAY_URL:-}
      FCM_RELAY_KEY: ${FCM_RELAY_KEY:-}
    networks:
      - funlife
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  draw-ws:
    build:
      context: ./tools/draw_ws
      dockerfile: ../../docker/Dockerfile.draw-ws
    container_name: funlife-draw-ws
    restart: unless-stopped
    ports:
      - "${DRAW_WS_HOST_PORT:-8790}:8790"
    environment:
      PB_BASE_URL: http://pocketbase:8090
      PORT: "8790"
      DRAW_WS_RELAY_KEY: ${DRAW_WS_RELAY_KEY:-}
      RING_SIZE: ${RING_SIZE:-400}
      MAX_MSG_PER_SEC: ${MAX_MSG_PER_SEC:-240}
      PB_AUTH_TIMEOUT_MS: ${PB_AUTH_TIMEOUT_MS:-4000}
      DRAW_WS_REPLAY_TAIL: ${DRAW_WS_REPLAY_TAIL:-320}
      DRAW_WS_ROOM_GO_MS: ${DRAW_WS_ROOM_GO_MS:-8000}
      DRAW_WS_LOG_CHUNKS: ${DRAW_WS_LOG_CHUNKS:-0}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - funlife
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pac-maze-ws:
    build:
      context: ..
      dockerfile: pocketbase/docker/Dockerfile.pac-maze-ws
    container_name: funlife-pac-maze-ws
    restart: unless-stopped
    ports:
      - "${PAC_MAZE_WS_HOST_PORT:-8791}:8791"
    environment:
      PB_BASE_URL: http://pocketbase:8090
      PAC_MAZE_WS_PORT: "8791"
      PAC_MAZE_DISCONNECT_MS: ${PAC_MAZE_DISCONNECT_MS:-30000}
      PAC_MAZE_ROOM_GO_MS: ${PAC_MAZE_ROOM_GO_MS:-8000}
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - funlife
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8791/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  fcm-relay:
    profiles: ["push"]
    build:
      context: ./tools/fcm_relay
      dockerfile: ../../docker/Dockerfile.fcm-relay
    container_name: funlife-fcm-relay
    restart: unless-stopped
    environment:
      PORT: "8787"
      FCM_RELAY_KEY: ${FCM_RELAY_KEY:?FCM_RELAY_KEY is required when using push profile}
      FCM_SERVICE_ACCOUNT: /run/secrets/firebase-adminsdk.json
    volumes:
      - ./secrets/firebase-adminsdk.json:/run/secrets/firebase-adminsdk.json:ro
    networks:
      - funlife
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  assets-static:
    image: nginx:alpine
    container_name: assets-static
    restart: unless-stopped
    ports:
      - "${ASSETS_HOST_PORT:-8098}:80"
    volumes:
      - ./assets_public:/usr/share/nginx/html:ro
      - ./docker/nginx/assets-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - funlife
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: funlife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: funlife_vip
      POSTGRES_USER: funlife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funlife_change_me}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - funlife
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funlife -d funlife_vip"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  funlife-api:
    profiles: ["api"]
    build:
      context: ../backend
      dockerfile: docker/Dockerfile.api
    container_name: funlife-api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-3400}:3400"
    environment:
      PORT: "3400"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://funlife:${POSTGRES_PASSWORD:-funlife_change_me}@postgres:5432/funlife_vip
      HMAC_SECRET: ${HMAC_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-25000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - funlife
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3400/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: funlife-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./docker/cloudflared:/etc/cloudflared:ro
    depends_on:
      pocketbase:
        condition: service_healthy
      draw-ws:
        condition: service_healthy
      pac-maze-ws:
        condition: service_healthy
      assets-static:
        condition: service_healthy
      funlife-api:
        condition: service_healthy
        required: false
    networks:
      - funlife

  vip-admin:
    profiles: ["admin"]
    build:
      context: ../backend
      dockerfile: docker/Dockerfile.admin
    container_name: funlife-vip-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-3300}:3300"
    environment:
      PORT: "3300"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://funlife:${POSTGRES_PASSWORD:-funlife_change_me}@postgres:5432/funlife_vip
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-changeme_set_in_env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-changeme_set_in_env}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - funlife
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3300/login.html"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  funlife:
    name: funlife-net
