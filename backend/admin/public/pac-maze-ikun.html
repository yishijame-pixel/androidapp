<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ikun 类须知 · FunLife 管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen text-stone-800">
  <div class="max-w-3xl mx-auto p-6 space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">豆人迷宫 · ikun 类进入须知</h1>
        <p class="text-sm text-stone-500 mt-1">用户进入「ikun类」分类前必须阅读并同意；保存后 version 自动更新，已同意用户需重新确认。</p>
      </div>
      <a href="/" class="text-sm text-amber-700 hover:underline">← 返回后台</a>
    </div>

    <div id="msg" class="hidden rounded-lg px-4 py-3 text-sm"></div>

    <form id="form" class="bg-white rounded-xl shadow-sm border border-stone-200 p-6 space-y-5">
      <label class="flex items-center gap-3">
        <input id="enabled" type="checkbox" class="w-4 h-4" checked />
        <span class="font-medium">启用必读弹框</span>
        <span class="text-xs text-stone-400">关闭后用户可直接进入 ikun 类</span>
      </label>

      <div>
        <label class="block text-sm font-medium mb-1">标题</label>
        <input id="title" class="w-full border border-stone-300 rounded-lg px-3 py-2" maxlength="120" />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">正文（支持换行）</label>
        <textarea id="body" rows="14" class="w-full border border-stone-300 rounded-lg px-3 py-2 font-mono text-sm" maxlength="12000"></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">同意按钮文案</label>
          <input id="agreeButtonText" class="w-full border border-stone-300 rounded-lg px-3 py-2" maxlength="40" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">底部提示</label>
          <input id="footerHint" class="w-full border border-stone-300 rounded-lg px-3 py-2" maxlength="120" />
        </div>
      </div>

      <div class="text-xs text-stone-500">
        当前版本：<span id="version">-</span> · 更新时间：<span id="updatedAt">-</span>
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-lg py-3">
        保存并发布（自动 bump version）
      </button>
    </form>
  </div>

  <script>
    const msgEl = document.getElementById("msg");
    function showMsg(text, ok) {
      msgEl.textContent = text;
      msgEl.className = "rounded-lg px-4 py-3 text-sm " + (ok ? "bg-green-50 text-green-800 border border-green-200" : "bg-red-50 text-red-800 border border-red-200");
      msgEl.classList.remove("hidden");
    }
    async function api(path, opts) {
      const r = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.error || j.message || "请求失败");
      return j;
    }
    async function load() {
      const { data } = await api("/api/pac_maze/ikun_disclosure");
      document.getElementById("enabled").checked = data.enabled !== false;
      document.getElementById("title").value = data.title || "";
      document.getElementById("body").value = data.body || "";
      document.getElementById("agreeButtonText").value = data.agreeButtonText || "";
      document.getElementById("footerHint").value = data.footerHint || "";
      document.getElementById("version").textContent = data.version ?? "-";
      document.getElementById("updatedAt").textContent = data.updatedAt || "-";
    }
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const body = {
          enabled: document.getElementById("enabled").checked,
          title: document.getElementById("title").value,
          body: document.getElementById("body").value,
          agreeButtonText: document.getElementById("agreeButtonText").value,
          footerHint: document.getElementById("footerHint").value,
        };
        const { data } = await api("/api/pac_maze/ikun_disclosure", { method: "POST", body: JSON.stringify(body) });
        document.getElementById("version").textContent = data.version;
        document.getElementById("updatedAt").textContent = data.updatedAt;
        showMsg("已保存。客户端将在下次进入 ikun 类时拉取新内容。", true);
      } catch (err) {
        showMsg(err.message, false);
      }
    });
    load().catch((e) => showMsg(e.message, false));
  </script>
</body>
</html>
