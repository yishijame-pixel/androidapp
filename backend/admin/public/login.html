<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FunLife 管理后台 · 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-200 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white text-3xl shadow-lg mb-4">🔐</div>
      <h1 class="text-2xl font-bold text-slate-900">FunLife 管理后台</h1>
      <p class="text-sm text-slate-500 mt-1">请使用管理员账号登录</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">用户名</label>
          <input id="username" type="text" autocomplete="username" required
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition"
                 placeholder="admin" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">密码</label>
          <input id="password" type="password" autocomplete="current-password" required
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition"
                 placeholder="••••••••" />
        </div>
        <div id="err" class="text-sm text-red-600 hidden"></div>
        <button type="submit" id="submit-btn"
                class="w-full py-2.5 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold shadow hover:shadow-lg transition disabled:opacity-60">
          登录
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">仅授权管理员可访问。登录尝试受限流保护。</p>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errBox = document.getElementById("err");
    const btn = document.getElementById("submit-btn");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.add("hidden");
      btn.disabled = true; btn.textContent = "登录中...";
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const j = await r.json();
        if (j.ok) { location.href = "/"; }
        else { errBox.textContent = j.error || "登录失败"; errBox.classList.remove("hidden"); }
      } catch (e) {
        errBox.textContent = "网络错误：" + e.message;
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "登录";
      }
    });
  </script>
</body>
</html>
