name: supertux-fork-android

on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/supertux-fork/**'
      - 'backend/tools/bootstrap_supertux_fork.*'
      - 'backend/tools/bootstrap_supertux_android.sh'
      - 'backend/tools/apply_supertux_android_patches.py'
      - 'backend/tools/patches/**'
      - 'backend/tools/init_supertux_submodules.sh'
      - 'backend/tools/verify_supertux_fork_tree.sh'
      - 'backend/tools/clone_supertux_upstream.*'
      - '.github/workflows/supertux-fork-android.yml'
  pull_request:
    paths:
      - 'engine/supertux-fork/**'
      - 'backend/tools/**'
      - '.github/workflows/supertux-fork-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SDL_TAG: "2.32.10"
      B_T_VERSION: "35.0.0"
      NDK_VERSION: "29.0.14206865"
      SDK_VERSION: "35"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_TRIPLET: arm64-android
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read SuperTux upstream pin
        id: supertux_pin
        run: |
          commit=$(python3 -c "import json; print(json.load(open('engine/supertux-fork/source_pin.json', encoding='utf-8-sig'))['commit'])")
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Checkout SuperTux upstream
        uses: actions/checkout@v4
        with:
          repository: SuperTux/supertux
          ref: ${{ steps.supertux_pin.outputs.commit }}
          path: reference-assets/supertux
          submodules: recursive
          fetch-depth: 0

      - name: Init nested submodules (simplesquirrel → squirrel)
        run: bash backend/tools/init_supertux_submodules.sh reference-assets/supertux

      - name: Bootstrap fork worktree
        run: bash backend/tools/bootstrap_supertux_fork.sh

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: supertux-android-arm64-vcpkg-v4-${{ hashFiles('.github/workflows/supertux-fork-android.yml') }}

      - name: Install vcpkg ports (arm64-android)
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          "$VCPKG_ROOT/vcpkg" install --classic --triplet=$VCPKG_TRIPLET \
            fmt libogg libvorbis libraqm freetype physfs glm libpng zlib \
            sdl2 sdl2-image sdl2-ttf curl openal-soft
          find "$VCPKG_ROOT/installed" -name '*.pc' -exec sed -i -E 's/-lc\+\+//g' {} \;

      - name: Patch vcpkg pkg-config files
        if: steps.cache-vcpkg.outputs.cache-hit == 'true'
        run: find "$VCPKG_ROOT/installed" -name '*.pc' -exec sed -i -E 's/-lc\+\+//g' {} \;

      - name: Bootstrap SDL Android project
        run: bash backend/tools/bootstrap_supertux_android.sh "${SDL_TAG}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v2
        with:
          packages: |
            platforms;android-${{ env.SDK_VERSION }}
            ndk;${{ env.NDK_VERSION }}
            build-tools;${{ env.B_T_VERSION }}

      - name: Write mk/android/local.properties and CI gradle tuning
        run: |
          test -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          mkdir -p engine/supertux-fork/mk/android
          {
            echo "vcpkg_root=${VCPKG_ROOT}"
            echo "ndk_home=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          } > engine/supertux-fork/mk/android/local.properties
          cat engine/supertux-fork/mk/android/local.properties
          cat >> engine/supertux-fork/mk/android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF

      - name: Build release APK (arm64-v8a)
        working-directory: engine/supertux-fork/mk/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Match upstream android.yml: Release build, no sq interpreter, no PCH (saves CI RAM).
          if ! ./gradlew assembleRelease \
            -Pcpuarch=arm64-v8a \
            -Pcmake_args="-DGIT_HASH=ci;-DGIT_BRANCH=main;-DSUPERTUX_PCH=OFF;-DSQ_DISABLE_INTERPRETER=ON" \
            --info --stacktrace 2>&1 | tee gradle-build.log; then
            echo "=== Gradle/native build failed — diagnostic tail ==="
            tail -n 200 gradle-build.log || true
            find app/.cxx -type f \( -name 'CMakeError.log' -o -name 'CMakeOutput.log' \) 2>/dev/null | while read -r f; do
              echo "==== $f ===="
              tail -n 80 "$f" || true
            done
            exit 1
          fi

      - name: Upload libsupertux2.so
        uses: actions/upload-artifact@v4
        with:
          name: libsupertux2-arm64-v8a
          path: |
            engine/supertux-fork/mk/android/app/build/intermediates/**/libsupertux2.so
            engine/supertux-fork/mk/android/app/build/intermediates/**/libc++_shared.so
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: supertux-fork-apk-arm64-release
          path: |
            engine/supertux-fork/mk/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supertux-android-gradle-log
          path: engine/supertux-fork/mk/android/gradle-build.log
          if-no-files-found: ignore
