name: platformer-supertux-validate

on:
  push:
    paths:
      - 'backend/tools/**'
      - 'dist/platformer_supertux/**'
      - 'dist/platformer_sfx/**'
  pull_request:
    paths:
      - 'backend/tools/**'
      - 'dist/platformer_supertux/**'
      - 'dist/platformer_sfx/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read SuperTux upstream pin
        id: supertux_pin
        run: |
          commit=$(python3 -c "import json; print(json.load(open('engine/supertux-fork/source_pin.json', encoding='utf-8-sig'))['commit'])")
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - name: Checkout SuperTux upstream
        uses: actions/checkout@v4
        with:
          repository: SuperTux/supertux
          ref: ${{ steps.supertux_pin.outputs.commit }}
          path: reference-assets/supertux
          submodules: recursive
          fetch-depth: 1
      - name: Install Pillow
        run: pip install Pillow
      - name: Import SuperTux bundles
        run: python backend/tools/import_supertux_platformer.py --skip-assets-mirror
      - name: Validate dist
        run: python backend/tools/validate_platformer_supertux.py
